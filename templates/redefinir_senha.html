
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRASCHOOL - Nova Senha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            height: 220px;
            background: #ffd000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-size: 35px;
            font-weight: 900;
        }

        .chapeu {
            font-size: 60px;
        }

        main {
            width: 90%;
            max-width: 400px;
            margin: 35px auto;
            padding: 35px 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px #00000015;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f8f8f8;
            outline: none;
        }

        input:focus {
            border-color: #ffd000;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ffd000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e6bb00;
        }

        .mensagem {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .erro {
            background: #f8d7da;
            color: #721c24;
        }

        .sucesso {
            background: #d4edda;
            color: #155724;
        }

        a {
            display: block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">GRASCHOOL</div>
        <div class="chapeu">🎓</div>
    </header>

    <main>

        <h1>Nova senha</h1>

        <p>
            Crie uma nova senha para acessar
            sua conta GRASCHOOL.
        </p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="mensagem {{ categoria }}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="password"
                name="senha"
                placeholder="Nova senha"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                name="confirmar_senha"
                placeholder="Confirmar nova senha"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Salvar nova senha
            </button>

        </form>

        <a href="{{ url_for('login') }}">
            Voltar para o login
        </a>

    </main>

</body>
</html>
