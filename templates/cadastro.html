<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GRASCHOOL - Criar Conta</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* FUNDO */
        body.login {
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CABEÇALHO */
        .topo {
            width: 100%;
            height: 240px;
            background: #ffd000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        .pontos {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 35px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #000;
        }

        .pontos.direita {
            left: auto;
            right: 25px;
        }

        .logo {
            font-size: 35px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #000;
            z-index: 1;
        }

        .chapeu {
            font-size: 65px;
            margin-top: 10px;
            z-index: 1;
        }

        .rasgo {
            position: absolute;
            bottom: -35px;
            left: -5%;
            width: 110%;
            height: 70px;
            background: #f5f5f5;
            border-radius: 50% 50% 0 0;
        }

        /* FORMULÁRIO */
        .formulario {
            width: 90%;
            max-width: 400px;
            margin: 25px auto 40px;
            padding: 35px 30px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .formulario h1 {
            font-size: 30px;
            text-transform: capitalize;
            color: #111;
            margin-bottom: 25px;
        }

        /* CAMPOS */
        .formulario input {
            width: 100%;
            padding: 15px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f8f8f8;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .formulario input:focus {
            border-color: #ffd000;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 208, 0, 0.20);
        }

        /* BOTÃO */
        .formulario button {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: #ffd000;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .formulario button:hover {
            background: #e6bb00;
            transform: translateY(-2px);
        }

        /* LINK PARA LOGIN */
        .texto-login {
            margin-top: 22px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        .texto-login a {
            color: #000;
            font-weight: bold;
            text-decoration: none;
        }

        .texto-login a:hover {
            color: #b39700;
            text-decoration: underline;
        }

        /* SITE */
        .site {
            margin-top: 25px;
            color: #888;
            font-size: 12px;
        }

        /* MENSAGENS DO FLASK */
        .mensagens {
            width: 100%;
            margin-bottom: 15px;
        }

        .mensagem {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .mensagem.sucesso {
            background: #d4edda;
            color: #155724;
        }

        .mensagem.erro {
            background: #f8d7da;
            color: #721c24;
        }

        .mensagem.info {
            background: #fff3cd;
            color: #856404;
        }

        /* CELULAR */
        @media (max-width: 480px) {
            .topo {
                height: 210px;
            }

            .logo {
                font-size: 29px;
            }

            .chapeu {
                font-size: 55px;
            }

            .formulario {
                padding: 30px 22px;
                margin-top: 20px;
            }

            .formulario h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body class="login">

    <header class="topo">

        <span class="pontos">•••</span>
        <span class="pontos direita">•••</span>

        <div class="logo">GRASCHOOL</div>

        <div class="chapeu">🎓</div>

        <div class="rasgo"></div>

    </header>

    <main class="formulario cadastro">

        <h1>Criar conta</h1>

        <!-- Mensagens de retorno do Flask -->
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                <div class="mensagens">
                    {% for categoria, mensagem in mensagens %}
                        <div class="mensagem {{ categoria }}">
                            {{ mensagem }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Formulário integrado ao Flask -->
        <form method="POST"
              action="{{ url_for('cadastro') }}"
              style="width: 100%;">

            <input
                type="text"
                name="nome"
                placeholder="NOME COMPLETO"
                autocomplete="name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="E-MAIL"
                autocomplete="email"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="SENHA"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <p class="texto-login">
            Já tem uma conta?
            <a href="{{ url_for('login') }}">Fazer login</a>
        </p>

        <p class="site">
            GRASCHOOL — Educação para todos
        </p>

    </main>

</body>
</html>
